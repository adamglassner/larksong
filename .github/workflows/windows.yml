name: Build Windows installer

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "version.properties"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Read version
        shell: bash
        run: echo "V=$(grep '^version=' version.properties | cut -d= -f2 | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Build installer
        shell: bash
        run: |
          set -o pipefail
          gradle -p desktop packageExe packageMsi createDistributable --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Collect
        shell: bash
        run: |
          mkdir out
          cp desktop/build/compose/binaries/main/exe/*.exe "out/Larksong-Setup-$V.exe"
          cp desktop/build/compose/binaries/main/msi/*.msi "out/Larksong-$V.msi"
          # Portable zip (Larksong\Larksong.exe and its runtime), which the Bytehawk Studio Launcher installs.
          (cd desktop/build/compose/binaries/main/app && 7z a -tzip -mx=7 "$GITHUB_WORKSPACE/out/Larksong-$V-win-x64.zip" Larksong >/dev/null)
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Larksong-windows
          path: out/

      # One release per version (windows-v1.2.0, …). The app's update button reads these.
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows --yes --cleanup-tag || true
          gh release delete "windows-v$V" --yes --cleanup-tag || true
          gh release create "windows-v$V" "out/Larksong-Setup-$V.exe" "out/Larksong-$V.msi" "out/Larksong-$V-win-x64.zip" --latest=true \
            --title "Larksong $V for Windows" \
            --notes "Built from ${GITHUB_SHA::7}. Run Larksong-Setup-$V.exe to install or update, or use Settings → Check for updates in the app."

      # A direct download link (no redirect) for stores like Microsoft's, which won't accept
      # GitHub release links. Served by GitHub Pages from the gh-pages branch:
      # https://adamglassner.github.io/larksong/download/windows/<version>/Larksong-<version>.msi
      # Keeps the five newest versions; the branch is rewritten each time so it stays small.
      - name: Publish to the download site
        shell: bash
        run: |
          REPO="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git clone -q --depth 1 -b gh-pages "$REPO" site 2>/dev/null || mkdir -p site
          rm -rf site/.git
          mkdir -p "site/download/windows/$V"
          cp "out/Larksong-$V.msi" "site/download/windows/$V/"
          ls -d site/download/windows/*/ | sed 's:/$::' | sort -V | head -n -5 | xargs -r rm -rf
          touch site/.nojekyll
          {
            echo '<!doctype html><meta charset="utf-8"><title>Larksong downloads</title>'
            echo '<h1>Larksong for Windows</h1><ul>'
            for d in $(ls site/download/windows | sort -Vr); do
              echo "<li><a href=\"download/windows/$d/Larksong-$d.msi\">Larksong $d (MSI)</a></li>"
            done
            echo '</ul><p>Older versions and other platforms: <a href="https://github.com/${{ github.repository }}/releases">Releases</a></p>'
          } > site/index.html
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "Downloads: Windows $V"
          git push -q -f "$REPO" gh-pages

      - name: Save to builds-windows branch
        shell: bash
        run: |
          manifest() {
            tag="$1"; title="$2"; shift 2; base="https://github.com/${{ github.repository }}"; list=""
            for f in "$@"; do
              size=$(wc -c < "$f" | tr -d ' ')
              list="$list${list:+,}{\"name\":\"$f\",\"url\":\"$base/releases/download/$tag/$f\",\"size\":$size}"
            done
            printf '{"version":"%s","title":"%s","page":"%s/releases/tag/%s","assets":[%s]}\n' "$V" "$title" "$base" "$tag" "$list" > latest.json
            cat latest.json
          }
          cd out
          manifest "windows-v$V" "Larksong $V for Windows" "Larksong-Setup-$V.exe" "Larksong-$V.msi"
          git init -q -b builds-windows
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add "Larksong-Setup-$V.exe" latest.json
          git commit -q -m "Installer $V from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" builds-windows

      # If the build fails, keep its log on a branch so it can be read without GitHub's log storage.
      - name: Save failure log
        if: failure()
        shell: bash
        run: |
          mkdir faillog && cp build.log faillog/ 2>/dev/null || echo "no log" > faillog/build.log
          cd faillog
          git init -q -b ci-log-windows
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -q -m "Failed build log"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-log-windows
